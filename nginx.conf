server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  # Хэшированные файлы сборки кэшируем надолго
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # SPA: всё остальное отдаёт index.html без кэша
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
