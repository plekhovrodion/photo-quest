<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0e6ff" />
    <title>ФотоКвест</title>
    <style>
      /* Заставка до загрузки скрипта: на медленном интернете скрипт качается несколько секунд, и белый экран пугает */
      body { margin: 0; background: #fff; }
      .pre-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; background: radial-gradient(circle at 50% 38%, #f2fff4 0, #d9f6de 55%, #bfeccb 100%); font-family: system-ui, -apple-system, sans-serif; }
      .pre-splash h2 { margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; color: #221c5f; }
      .pre-splash .bar { width: min(280px, 70vw); height: 16px; border-radius: 8px; background: rgba(255, 255, 255, .75); overflow: hidden; }
      .pre-splash .bar i { display: block; width: 40%; height: 100%; border-radius: 8px; background: #6fcb7d; animation: pre-run 1.2s ease-in-out infinite alternate; }
      @keyframes pre-run { from { transform: translateX(0); } to { transform: translateX(150%); } }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"><div class="pre-splash"><div class="bar"><i></i></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
