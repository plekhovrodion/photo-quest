<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0e6ff" />
    <title>ФотоКвест</title>
    <style>
      /* Тот же индикатор отображается до запуска скрипта и во время загрузки игры. */
      body { margin: 0; background: #fff; }
      .loading-screen.pre-splash { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 50% 38%, #f2fff4 0, #d9f6de 55%, #bfeccb 100%); }
      .pre-splash .loc-progress { width: min(100%, 600px); height: 40px; }
      .pre-splash .loc-track { width: 100%; height: 40px; border-radius: 999px; padding: 4px; background: rgba(255, 255, 255, .82); overflow: hidden; }
      .pre-splash .loc-fill { display: block; width: var(--w, 25%); height: 100%; min-width: 0; border-radius: 999px; background-color: #58c978; background-repeat: repeat-x; background-size: 30px 100%; animation: loc-grow 1.4s cubic-bezier(.22, 1, .36, 1) .35s backwards, loc-stripes 2.4s linear infinite; }
      @keyframes loc-grow { from { width: 0; } }
      @keyframes loc-stripes { to { background-position: 30px 0; } }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"><div class="loading-screen model-loading-screen pre-splash"><div class="loc-progress" role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25"><div class="loc-track"><div class="loc-fill" style="--w:25%;background-image:url('%BASE_URL%art/loc/stripe-a.svg')"></div></div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
